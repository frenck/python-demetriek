---
name: Feature request
description: Suggest a new feature for the LaMetric Python client.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature you'd like to see.
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: Device model
      description: The LaMetric device this relates to (if relevant).
      placeholder: For example, LaMetric TIME, LaMetric SKY
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Any additional context, examples, or references.
    validations:
      required: false
